services:
  - type: web
    name: sec-red-flag-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SEC_EDGAR_USER_AGENT
        sync: false
